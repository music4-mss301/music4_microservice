<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px;">
<div style="max-width: 480px; margin: auto; background: white;
              border-radius: 8px; padding: 32px;">
    <h2 style="color: #333;">Reset Password</h2>
    <p>Hello <span th:text="${userName}"></span>,</p>
    <p>You have requested to reset your password. Click the button below:</p>
    <a th:href="${resetLink}"
       style="display: inline-block; padding: 12px 24px;
              background: #4F46E5; color: white;
              border-radius: 6px; text-decoration: none; font-weight: bold;">
        Reset password
    </a>
    <p style="color: #888; font-size: 13px; margin-top: 24px;">
        This link is valid for <strong>15 minutes</strong>.<br>
        If you don't request, please ignore this email.
    </p>
</div>
</body>
</html>
