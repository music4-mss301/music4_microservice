spring.application.name=Music4

# Connection URL for SQL Server using the Microsoft JDBC driver
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Music4_v3;encrypt=false;

# Database username and password
spring.datasource.username=sa
spring.datasource.password=123

# Use the Microsoft SQL Server JDBC driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings suitable for Microsoft SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=true

# Physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=ap-southeast-2
aws.s3.bucket=my-musicapp-storage