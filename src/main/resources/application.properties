spring.application.name=Music4

# Connection URL for SQL Server using the Microsoft JDBC driver
spring.datasource.url=${DB_URL}

# Database username and password
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use the Microsoft SQL Server JDBC driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings suitable for Microsoft SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
#spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# AWS S3 Configuration
aws.s3.access-key= ${ACCESS_KEY}
aws.s3.secret-key= ${SECRET_KEY}
aws.s3.region=ap-southeast-1
aws.s3.bucket=music4-v3-storage-kenz

# Upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Spring mail configuration for Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ===== App Custom =====
app.frontend-url=http://localhost:5173
app.mail.from=Music App <noreply@gmail.com>

logging.level.org.springframework.web=DEBUG
# Log chi tiáº¿t Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Email Service logging
logging.level.vn.edu.fpt.sba.music4.services.impl.EmailService=DEBUG
logging.level.vn.edu.fpt.sba.music4.services.impl.ResetPasswordServiceImpl=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
# T?ng th?i gian s?ng c?a Access Token lên 7 ngày (tính b?ng mili-giây)
JWT_ACCESS_EXPIRES_IN=604800000