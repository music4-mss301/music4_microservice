spring.application.name=Music4

# Connection URL for SQL Server using the Microsoft JDBC driver
spring.datasource.url=${DB_URL}

# Database username and password
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Use the Microsoft SQL Server JDBC driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings suitable for Microsoft SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
#spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.show_sql=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Physical naming strategy
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# AWS S3 Configuration
aws.s3.access-key= ${ACCESS_KEY}
aws.s3.secret-key= ${SECRET_KEY}
aws.s3.region=ap-southeast-1
aws.s3.bucket=music4-v3-storage-kenz

# Upload size limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Spring mail configuration for Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ===== App Custom =====
app.frontend-url=http://localhost:5173
app.mail.from=Music App <noreply@gmail.com>

logging.level.org.springframework.web=DEBUG
# Log chi tiet Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
# Email Service logging
logging.level.vn.edu.fpt.sba.music4.services.impl.EmailService=DEBUG
logging.level.vn.edu.fpt.sba.music4.services.impl.ResetPasswordServiceImpl=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
# Tang thoi gian song cua Access Token len 7 ngay (tinh bang mili-giay)
JWT_ACCESS_EXPIRES_IN=604800000

# AI
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Elasticsearch
elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:9200}

# Elasticsearch API
app.python.embed.url=${APP_PYTHON_EMBED_URL:http://localhost:8000/api/ai/embed}
app.elasticsearch.url=${APP_ELASTICSEARCH_URL:http://localhost:9200/music_tracks/_doc/}
app.es.search.url=${APP_ES_SEARCH_URL:http://localhost:9200/music_tracks/_knn_search}