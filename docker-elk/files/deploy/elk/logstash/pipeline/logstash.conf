# Nhận log JSON (mỗi dòng một sự kiện) từ các service Java qua TCP 5000, ghi vào Elasticsearch theo ngày.
input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Logstash dùng @timestamp do logback-logstash-encoder gửi sẵn; chỉ dọn bớt trường thừa
  mutate {
    remove_field => ["[event][original]", "[host]", "[port]"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "music4-logs-%{+YYYY.MM.dd}"
  }
}
