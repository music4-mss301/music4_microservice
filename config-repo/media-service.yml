# ==============================================================================
# CẤU HÌNH RIÊNG CHO MEDIA-SERVICE (Kế thừa phần chung từ config-repo/application.yml)
# ==============================================================================
server:
  port: ${SERVER_PORT:8085}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/music4_media}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

app:
  security:
    public-get-paths:
      - /api/media/stream/preview
      - /api/media/file
  storage:
    access-key: ${ACCESS_KEY}
    secret-key: ${SECRET_KEY}
    region: ${AWS_REGION:ap-southeast-1}
    bucket: ${AWS_S3_BUCKET}
    preview-bytes: 1048576
