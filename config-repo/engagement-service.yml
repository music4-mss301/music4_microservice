# ==============================================================================
# CẤU HÌNH RIÊNG CHO ENGAGEMENT-SERVICE (Kế thừa phần chung từ config-repo/application.yml)
# ==============================================================================
server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/music4_engagement}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

app:
  security:
    public-get-paths:
      - /api/ratings/average/**
      - /api/comments/track/**
      - /api/favorites/track/**
      - /api/follows/artist/**
      - /api/follows/user/**
      - /api/playlists/user/**
      - /api/playlists/*
      - /api/playlists/*/tracks
