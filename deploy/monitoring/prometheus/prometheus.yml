global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api-gateway:8080']
        labels:
          application: 'api-gateway'

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8081']
        labels:
          application: 'user-service'

  - job_name: 'content-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['content-service:8082']
        labels:
          application: 'content-service'

  - job_name: 'engagement-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['engagement-service:8083']
        labels:
          application: 'engagement-service'

  - job_name: 'analytics-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['analytics-service:8084']
        labels:
          application: 'analytics-service'

  - job_name: 'media-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['media-service:8085']
        labels:
          application: 'media-service'

  - job_name: 'search-admin-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['search-admin-service:8086']
        labels:
          application: 'search-admin-service'

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['config-server:8888']
        labels:
          application: 'config-server'

  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']
        labels:
          application: 'eureka-server'
